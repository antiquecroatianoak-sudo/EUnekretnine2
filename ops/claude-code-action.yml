# PRIJEDLOG, NEAKTIVNO. Ova datoteka nije u .github/workflows i ne pokreće se ni nakon spajanja.
# Radi tek kad vlasnik nakon pregleda (1) premjesti datoteku u .github/workflows/claude.yml,
# (2) instalira Claude GitHub App na ovaj repozitorij i (3) sam doda tajnu CLAUDE_CODE_OAUTH_TOKEN.
# Pojedinosti i ograničenja: ops/claude-code-action.md.
name: Claude na zadatak vlasnika
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
# Bez schedule, push i workflow_run okidača: ništa se ne pokreće samo od sebe ni iz vlastitog rezultata.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    # Samo komentar vlasnika koji izričito sadrži @claude; komentari botova, uključujući Claudeove, ne okidaju posao.
    if: >-
      github.event.comment.user.login == 'antiquecroatianoak-sudo' &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.user.type == 'User' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Postoji li autorizacija
        id: auth
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN nije postavljen; posao se preskače, ništa nije pokrenuto."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.auth.outputs.ready == 'true'
        with:
          fetch-depth: 1
      # Pri primjeni zamijeniti @v1 punim SHA-om provjerenog izdanja.
      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ready == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Samo izmjene koda i lokalni testovi; bez spajanja, objave, mreže i drugih tajni.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python -m unittest:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*)"
            --disallowedTools "WebFetch,WebSearch,Bash(gh pr merge:*),Bash(gh api:*),Bash(curl:*),Bash(git push --force:*),Bash(git push origin main:*)"
