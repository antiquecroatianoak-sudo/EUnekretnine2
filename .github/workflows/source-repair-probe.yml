name: Read-only inactive source repair evidence
on:
  pull_request:
    paths: [source_repair_probe.py, .github/workflows/source-repair-probe.yml]
  push:
    branches: [main]
    paths: [source_repair_probe.py, .github/workflows/source-repair-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -q test_source_repair_probe
      - run: python source_repair_probe.py
