name: Dohvat javnih kandidata nekretnina i kupaca
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - discovery.py
      - registry_discovery.py
      - public_land_sources.py
      - verify_public_land_import.py
      - test_public_land_sources.py
      - data/public_land_registry.json
      - test_public_land.mjs
      - verification.mjs
      - test_verification.mjs
      - test_registry_discovery.py
      - test_population_refresh.py
      - sync_discovery.py
      - .github/workflows/discovery.yml
permissions:
  contents: write
  id-token: write
jobs:
  public-land-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: public-land-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testiraj prepoznavanje službenih javnih kupaca
        run: |
          python -m unittest -v test_public_land_sources
          node test_public_land.mjs
      - name: Uvezi registrirane službene pozive i provjeri uparivanje
        env:
          PYTHONUNBUFFERED: '1'
        run: python verify_public_land_import.py
  scan:
    concurrency:
      group: discovery-main
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provjeri nastavak uvoza, duplikate i valute
        run: python -m unittest -v test_registry_discovery test_population_refresh test_public_land_sources
      - name: Provjeri pravila dokaza i nepotvrđenog interesa
        run: node test_verification.mjs
      - name: Uvezi aktualni registar i nastavi spremljene stranice
        id: registry
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python registry_discovery.py
      - name: Dohvati javne izvore bez prijave i ključeva
        id: discovery
        continue-on-error: true
        run: python discovery.py
      - name: Sačuvaj nalaze i status svih izvora
        run: |
          git config user.name 'EU platform source monitor'
          git config user.email 'source-monitor@users.noreply.github.com'
          git add data/discovered_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Osvježi javne kandidate i stanje izvora'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Spremi kandidate i uparivanje u zajedničku bazu
        run: python sync_discovery.py
      - name: Označi nepotpun dohvat
        if: steps.discovery.outcome == 'failure' || steps.registry.outcome == 'failure'
        run: exit 1
