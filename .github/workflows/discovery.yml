name: Dohvat javnih kandidata nekretnina i kupaca
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - discovery.py
      - source_batches.py
      - property_connector.py
      - test_property_connector.py
      - profile_imports.py
      - test_profile_imports.py
      - buyer_profiles.py
      - profile_imports.py
      - test_buyer_profiles.py
      - test_source_batches.py
      - national_enrichment.py
      - supabase/functions/registry-discovery/national-enrichment.mjs
      - test_national_enrichment.mjs
      - registry_discovery.py
      - source_leads.py
      - test_source_leads.py
      - public_land_sources.py
      - verify_public_land_import.py
      - test_public_land_sources.py
      - data/public_land_registry.json
      - test_public_land.mjs
      - verification.mjs
      - test_verification.mjs
      - test_registry_discovery.py
      - test_population_refresh.py
      - sync_discovery.py
      - .github/workflows/discovery.yml
permissions:
  contents: write
  id-token: write
jobs:
  public-land-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: public-land-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provjeri obvezni filtar aktivnosti oglasa
        run: |
          python -m unittest -v test_active_listings
          node test_active_listings.mjs
      - name: Testiraj prepoznavanje službenih javnih kupaca
        run: |
          python -m unittest -v test_public_land_sources
          node test_public_land.mjs
      - name: Uvezi registrirane službene pozive i provjeri uparivanje
        env:
          PYTHONUNBUFFERED: '1'
        run: python verify_public_land_import.py
  scan:
    concurrency:
      group: discovery-main
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provjeri nastavak uvoza, duplikate i valute
        run: python -m unittest -v test_registry_discovery test_population_refresh test_public_land_sources test_source_leads test_source_batches test_buyer_profiles
      - name: Provjeri pravila dokaza i nepotvrđenog interesa
        run: node test_verification.mjs
      - name: Skupno dijagnosticiraj neaktivne izvore bez aktivacije ili promjene uvoznih cursora
        id: source_batches
        continue-on-error: true
        timeout-minutes: 6
        env:
          PYTHONUNBUFFERED: '1'
        run: python source_batches.py
      - name: Uvezi aktualni registar i nastavi spremljene stranice
        id: registry
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: '1'
        run: python registry_discovery.py
      - name: Provjeri do 10 novih tragova izvora (robots.txt, bez prijave, bez automatskog uključivanja)
        id: leads
        continue-on-error: true
        run: python source_leads.py 10
      - name: Dohvati javne izvore bez prijave i ključeva
        id: discovery
        continue-on-error: true
        run: python discovery.py
      - name: Sačuvaj nalaze i status svih izvora
        run: |
          git config user.name 'EU platform source monitor'
          git config user.email 'source-monitor@users.noreply.github.com'
          git add data/discovered_candidates.json data/source_leads.json data/source_batches.json data/profile_imports.json
          if ! git diff --cached --quiet; then
            git commit -m 'Osvježi javne kandidate i stanje izvora'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Spremi kandidate i uparivanje u zajedničku bazu
        run: python sync_discovery.py
      - name: Označi nepotpun dohvat
        if: steps.discovery.outcome == 'failure' || steps.registry.outcome == 'failure'
        run: exit 1


  national-enrichment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: national-enrichment-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Provjeri državu, potpuni identitet, proturječja i očuvanje podataka
        run: node --test test_national_enrichment.mjs
      - name: Dopuni postojeće zapise kroz nacionalne servise po državama EU27
        env:
          PYTHONUNBUFFERED: '1'
        run: python national_enrichment.py

  property-groups:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    concurrency:
      group: property-groups-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provjeri zajednički uvoznik pojedinačnih oglasa
        run: python -m unittest -v test_property_connector test_registry_discovery test_source_batches test_buyer_profiles
      - name: Skupno probno uvezi neaktivne kataloge bez automatske aktivacije
        env:
          PYTHONUNBUFFERED: '1'
        run: python property_connector.py
      - name: Sačuvaj potpuni ishod skupine
        run: |
          git config user.name 'EU platform source monitor'
          git config user.email 'source-monitor@users.noreply.github.com'
          git add data/property_imports.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sačuvaj ishod skupnog uvoza kataloga'
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin main
          fi

  profile-imports:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: acquisition-profile-imports-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provjeri kriterije, kontakte i potvrdu upisa profila
        run: python -m unittest -q test_buyer_profiles test_profile_imports
      - name: Probno uvezi pregledane javne kriterije kupnje bez aktivacije
        env:
          PYTHONUNBUFFERED: '1'
        run: python profile_imports.py
      - name: Sačuvaj ishod provjere profila
        run: |
          git config user.name 'EU platform source monitor'
          git config user.email 'source-monitor@users.noreply.github.com'
          git add data/profile_imports.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sačuvaj provjeru uvoza profila kupaca'
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin main
          fi


