name: Read-only probe of five candidate sources
on:
  pull_request:
    paths: [.github/workflows/new-agency-probe.yml]
  push:
    branches: [codex/new-agency-import]
    paths: [.github/workflows/new-agency-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch one permitted page per source without database writes
        run: |
          python - <<'PY'
          import json
          from registry_discovery import Fetcher, Page, objects
          urls=[
            'https://www.immonestor.at/immobilien',
            'https://www.adamant-immobilien.at/',
            'https://www.immolution.at/',
            'https://www.raiffeisen-immobilien.at/de/immobilien/kauf/7000/eisenstadt/anlegerwohnung-im-herzen-von-eisenstadt.0001011757?category%5B0%5D=flat&sales_type=buy',
            'https://zweitwohnsitze.com/objekte/Kreischberg-Chalets-Haus-44-A.html'
          ]
          for url in urls:
              try:
                  page=Page(Fetcher(url).get(url))
                  nodes=[obj for script in page.scripts for obj in objects(script)]
                  result=dict(url=url,title=page.title,structured=nodes[:12],links=page.links[:100],text=' '.join(page.text)[:24000])
              except Exception as error:
                  result=dict(url=url,error=type(error).__name__+': '+str(error)[:500])
              print('SOURCE_PROBE '+json.dumps(result,ensure_ascii=False),flush=True)
          PY
